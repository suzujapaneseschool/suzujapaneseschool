<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Suzu Sensei — 管理者パネル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>window.onTurnstileLoad = function(){ if (typeof renderLoginTurnstile === 'function') renderLoginTurnstile(); };</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
<style>
:root{
  --cream:#fbf7ec; --cream-2:#f4ecd9;
  --mango:#f5b800; --mango-deep:#e89a00; --amber:#f08a1d;
  --gold:#c9a24b; --gold-soft:#e3cd96;
  --ink:#1f1a14; --ink-2:#5d5345;
  --herb:#6b8e4e;
  --white-choc:#f7efd9;
  --danger:#c1443c;
  --radius:16px;
  --shadow:0 10px 26px rgba(31,26,20,.07);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--cream);color:var(--ink);
  font-family:'Fraunces',serif;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(circle at 12% 8%, rgba(245,184,0,.09), transparent 40%),
                    radial-gradient(circle at 90% 85%, rgba(201,162,75,.09), transparent 42%);
}
.jp{font-family:'Shippori Mincho',serif;}
.kaku{font-family:'Zen Kaku Gothic New',sans-serif;}
a{color:inherit;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
::selection{background:var(--mango);color:var(--ink);}
.hidden{display:none !important;}

/* ---------- LOGIN ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{
  width:100%;max-width:400px;background:var(--white-choc);border:1.5px solid var(--gold-soft);
  border-radius:20px;box-shadow:var(--shadow);padding:40px 32px;text-align:center;
}
.login-stamp{
  width:74px;height:74px;border-radius:50%;background:linear-gradient(150deg,var(--mango),var(--mango-deep));
  color:var(--ink);display:grid;place-items:center;margin:0 auto 18px;font-family:'Shippori Mincho',serif;
  font-size:2.1rem;font-weight:700;box-shadow:0 10px 22px rgba(232,154,0,.35);
}
.login-title{font-size:1.5rem;font-weight:700;margin-bottom:4px;}
.login-title .jp{display:block;font-size:1rem;color:var(--mango-deep);letter-spacing:2px;margin-top:4px;}
.login-sub{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.82rem;color:var(--ink-2);letter-spacing:.5px;margin-bottom:26px;}
.field{margin-bottom:16px;text-align:left;}
.field label{display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:1px;color:var(--ink-2);margin-bottom:6px;text-transform:uppercase;}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],input[type=date],select,textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--gold-soft);border-radius:10px;background:var(--cream);
  outline:none;transition:border-color .2s, box-shadow .2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--mango-deep);box-shadow:0 0 0 3px rgba(245,184,0,.18);}
textarea{resize:vertical;min-height:70px;}
.cf-turnstile{margin:14px 0;display:flex;justify-content:center;}
.btn{
  font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;border:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:40px;
  transition:transform .2s, box-shadow .2s, background .2s, color .2s; text-decoration:none;
}
.btn-fill{background:linear-gradient(135deg,var(--mango),var(--amber));color:var(--ink);padding:13px 22px;font-size:.95rem;width:100%;}
.btn-fill:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(240,138,29,.35);}
.btn-fill:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;}
.feedback{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.85rem;margin-top:14px;min-height:18px;}
.feedback.err{color:var(--danger);}
.feedback.ok{color:var(--herb);}

/* ---------- DASHBOARD SHELL ---------- */
#dashboard{max-width:1240px;margin:0 auto;padding:26px 24px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-stamp{
  width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--mango);display:grid;place-items:center;
  font-family:'Shippori Mincho',serif;font-weight:700;font-size:1.25rem;
}
.brand-name{font-weight:700;font-size:1.2rem;line-height:1.15;}
.brand-kicker{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.72rem;letter-spacing:2px;color:var(--ink-2);text-transform:uppercase;}
.btn-ghost{background:transparent;border:1.5px solid var(--gold-soft);color:var(--ink);padding:10px 18px;font-size:.85rem;}
.btn-ghost:hover{border-color:var(--mango-deep);background:rgba(245,184,0,.08);}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.stat-card{background:var(--white-choc);border:1.5px solid var(--gold-soft);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.stat-val{font-size:1.8rem;font-weight:900;line-height:1;}
.stat-label{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.72rem;letter-spacing:1px;color:var(--ink-2);margin-top:8px;text-transform:uppercase;}
.stat-card.attn{border-color:var(--mango-deep);background:rgba(245,184,0,.1);}

/* widgets row: upcoming lessons + revenue chart */
.widgets-row{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:22px;}
@media(max-width:860px){.widgets-row{grid-template-columns:1fr;}}
.widget-title{font-weight:700;font-size:1rem;margin-bottom:2px;}
.widget-title .jp{font-size:.75em;color:var(--mango-deep);margin-left:8px;}
.widget-sub{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.72rem;color:var(--ink-2);letter-spacing:.5px;margin-bottom:14px;text-transform:uppercase;}
.upcoming-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--gold-soft);font-size:.86rem;}
.upcoming-item:last-child{border-bottom:none;}
.upcoming-when{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:.78rem;color:var(--mango-deep);white-space:nowrap;}
.upcoming-who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 10px;}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.chart-bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--mango),var(--amber));min-height:3px;transition:height .3s;}
.chart-label{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.65rem;color:var(--ink-2);white-space:nowrap;}
.chart-val{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.66rem;color:var(--ink);font-weight:700;}

/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{
  font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:.86rem;background:transparent;
  border:1.5px solid var(--gold-soft);color:var(--ink-2);padding:10px 20px;border-radius:40px;cursor:pointer;
  transition:all .2s;
}
.tab-btn .jp{font-size:.78em;margin-left:6px;opacity:.8;}
.tab-btn.active{background:var(--ink);border-color:var(--ink);color:var(--mango);}

/* panel + toolbar */
.panel{background:var(--white-choc);border:1.5px solid var(--gold-soft);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}
.toolbar .field{margin:0;min-width:150px;flex:1 1 150px;}
.toolbar .field.grow{flex:2 1 220px;}
.toolbar-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.btn-sm{padding:11px 16px;font-size:.82rem;white-space:nowrap;}

/* bulk action bar */
.bulk-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--white-choc);
  border-radius:12px;padding:12px 16px;margin-bottom:14px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.84rem;
}
.bulk-bar select{background:var(--cream);border:none;padding:8px 10px;border-radius:8px;color:var(--ink);width:auto;min-width:130px;}
.bulk-bar .btn-sm{padding:8px 14px;font-size:.78rem;}
.bulk-bar .btn-outline{background:transparent;border:1.5px solid rgba(251,247,236,.4);color:var(--white-choc);}
.bulk-bar .btn-outline:hover{border-color:var(--white-choc);}

/* table */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--gold-soft);}
table{width:100%;border-collapse:collapse;min-width:640px;}
thead th{
  font-family:'Zen Kaku Gothic New',sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:1px;
  color:var(--ink-2);text-align:left;padding:12px 14px;background:var(--cream-2);border-bottom:1.5px solid var(--gold-soft);
  white-space:nowrap;
}
th.th-check{width:36px;}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{color:var(--mango-deep);}
tbody td{padding:13px 14px;border-bottom:1px solid rgba(201,162,75,.25);font-size:.9rem;vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(245,184,0,.06);}
.cell-muted{color:var(--ink-2);font-size:.8rem;}
.cell-actions{display:flex;gap:8px;white-space:nowrap;}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:1.5px solid var(--gold-soft);background:var(--cream);
  cursor:pointer;display:grid;place-items:center;transition:all .2s;color:var(--ink);
}
.icon-btn:hover{border-color:var(--mango-deep);background:rgba(245,184,0,.12);}
.icon-btn.danger:hover{border-color:var(--danger);background:rgba(193,68,60,.1);color:var(--danger);}
.badge{
  display:inline-block;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:.7rem;
  letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;white-space:nowrap;
}
.badge-mango{background:rgba(245,184,0,.18);color:#8a5c00;}
.badge-herb{background:rgba(107,142,78,.18);color:#3f5c2b;}
.badge-danger{background:rgba(193,68,60,.14);color:var(--danger);}
.badge-muted{background:rgba(93,83,69,.14);color:var(--ink-2);}
.badge-gold{background:rgba(201,162,75,.2);color:#7a5c1e;}

.empty-state{padding:40px 20px;text-align:center;color:var(--ink-2);font-family:'Zen Kaku Gothic New',sans-serif;font-size:.9rem;}

.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap;}
.pagination .info{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.8rem;color:var(--ink-2);}
.pagination .btns{display:flex;gap:8px;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(31,26,20,.55);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:1000;
}
.modal{
  background:var(--white-choc);border-radius:20px;border:1.5px solid var(--gold-soft);box-shadow:0 30px 60px rgba(31,26,20,.3);
  width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:28px;
}
.modal h3{font-size:1.2rem;margin-bottom:4px;}
.modal .modal-sub{font-family:'Zen Kaku Gothic New',sans-serif;font-size:.78rem;color:var(--ink-2);margin-bottom:20px;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
.modal-grid .span2{grid-column:1/-1;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.85rem;}
.checkbox-row input{width:auto;}
.modal-actions{display:flex;gap:10px;margin-top:22px;}
.btn-outline{background:transparent;border:1.5px solid var(--gold-soft);color:var(--ink);flex:1;padding:12px;font-size:.88rem;}
.btn-outline:hover{border-color:var(--ink-2);}
.btn-danger{background:var(--danger);color:#fff;padding:12px;font-size:.88rem;flex:1;}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(193,68,60,.35);}
.btn-fill.grow{flex:1;width:auto;}

/* toasts */
#toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:2000;}
.toast{
  font-family:'Zen Kaku Gothic New',sans-serif;font-size:.85rem;font-weight:500;padding:14px 18px;border-radius:12px;
  background:var(--ink);color:var(--white-choc);box-shadow:0 12px 26px rgba(31,26,20,.3);max-width:320px;
  animation:toastIn .25s ease-out;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--herb);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin:0 2px;animation:blink 1.2s infinite;}
.loading-dot:nth-child(2){animation-delay:.2s;}
.loading-dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

@media(max-width:640px){
  .modal-grid{grid-template-columns:1fr;}
  thead{display:none;}
  table,tbody,tr,td{display:block;width:100%;}
  tbody tr{border-bottom:1px solid var(--gold-soft);padding:10px 0;}
  tbody td{border-bottom:none;padding:5px 4px;}
  tbody td::before{content:attr(data-label);display:block;font-family:'Zen Kaku Gothic New',sans-serif;font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--ink-2);margin-bottom:2px;}
}
</style>
</head>
<body>

<div id="loadingScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <span class="kaku" style="color:var(--ink-2);">Loading<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></span>
</div>

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="hidden">
  <div class="login-card">
    <div class="login-stamp">鈴</div>
    <h1 class="login-title">Admin Login<span class="jp">管理者ログイン</span></h1>
    <p class="login-sub">SUZU SENSEI — CONTROL PANEL</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="loginPassword">パスワード / Password</label>
        <input type="password" id="loginPassword" name="password" placeholder="パスワードを入力してください" required autocomplete="current-password">
      </div>
      <div class="cf-turnstile" id="login-turnstile"></div>
      <button type="submit" class="btn btn-fill" id="loginSubmit">Sign In</button>
      <p class="feedback" id="loginFeedback"></p>
    </form>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard" class="hidden">
  <div class="topbar">
    <div class="brand">
      <div class="brand-stamp">鈴</div>
      <div>
        <div class="brand-name">Suzu Sensei</div>
        <div class="brand-kicker">管理者パネル · Admin Panel</div>
      </div>
    </div>
    <button class="btn btn-ghost" id="logoutBtn">Log Out</button>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="widgets-row">
    <div class="panel">
      <div class="widget-title">Upcoming Lessons <span class="jp">今後のレッスン</span></div>
      <div class="widget-sub">Next 7 days</div>
      <div id="upcomingList"></div>
    </div>
    <div class="panel">
      <div class="widget-title">Revenue <span class="jp">売上</span></div>
      <div class="widget-sub">Last 6 months, completed orders</div>
      <div id="revenueChart"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="bookings">Free Trials <span class="jp">無料体験</span></button>
    <button class="tab-btn" data-tab="orders">Orders &amp; Payments <span class="jp">契約・支払い</span></button>
    <button class="tab-btn" data-tab="contacts">Messages <span class="jp">お問い合わせ</span></button>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="field grow">
        <label>Search</label>
        <input type="text" id="filterQ" placeholder="Search…">
      </div>
      <div class="field" id="statusFilterField">
        <label>Status</label>
        <select id="filterStatus"><option value="">All</option></select>
      </div>
      <div class="field">
        <label id="fromLabel">From</label>
        <input type="date" id="filterFrom">
      </div>
      <div class="field">
        <label id="toLabel">To</label>
        <input type="date" id="filterTo">
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-outline btn-sm" id="exportBtn">⭳ Export CSV</button>
        <button class="btn btn-outline btn-sm" id="refreshBtn">↻ Refresh</button>
        <button class="btn btn-fill btn-sm" id="addBtn">+ Add</button>
      </div>
    </div>

    <div class="bulk-bar hidden" id="bulkBar">
      <span id="bulkCount"></span>
      <select id="bulkStatus"></select>
      <button class="btn btn-outline btn-sm" id="bulkApplyStatus">Set Status</button>
      <button class="btn btn-danger btn-sm" id="bulkDelete" style="flex:none;">Delete Selected</button>
      <button class="btn btn-outline btn-sm" id="bulkClear" style="margin-left:auto;">Clear Selection</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state hidden" id="emptyState">No records found.</div>
    </div>

    <div class="pagination">
      <span class="info" id="pageInfo"></span>
      <div class="btns">
        <button class="btn btn-outline btn-sm" id="prevPage">← Prev</button>
        <button class="btn btn-outline btn-sm" id="nextPage">Next →</button>
      </div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
/* ============================================================
   CONFIG — table/column/form definitions per entity. Adding a
   new field only requires editing this object, not the render logic.
   ============================================================ */
const TURNSTILE_SITE_KEY = '0x4AAAAAAEbuBsYGlWRLSLK3';

const STATUS_BADGE = {
  booked:'badge-mango', completed:'badge-herb', cancelled:'badge-muted', no_show:'badge-danger',
  new:'badge-mango', contacted:'badge-gold', closed:'badge-muted',
  pending:'badge-mango', refunded:'badge-muted', failed:'badge-danger'
};

const ENTITIES = {
  bookings: {
    api: '/admin/api/bookings',
    label: 'Free Trial Bookings',
    dateField: 'start_iso',
    emailKey: 'email',
    defaultSort: 'start_iso',
    fromToLabels: ['Lesson from', 'Lesson to'],
    statusOptions: ['booked','completed','cancelled','no_show'],
    columns: [
      { key:'name', label:'Name', sortable:true },
      { key:'email', label:'Email', sortable:true },
      { key:'start_iso', label:'Lesson Date', type:'datetime', sortable:true },
      { key:'country', label:'Country' },
      { key:'timezone', label:'Timezone' },
      { key:'status', label:'Status', type:'badge', sortable:true }
    ],
    formFields: [
      { key:'name', label:'Name', type:'text', required:true },
      { key:'email', label:'Email', type:'email', required:true },
      { key:'start_iso', label:'Lesson Date & Time (your local time)', type:'datetime-local', required:true, span2:true },
      { key:'country', label:'Country', type:'text' },
      { key:'timezone', label:'Timezone', type:'text' },
      { key:'status', label:'Status', type:'select', options:['booked','completed','cancelled','no_show'] },
      { key:'message', label:'Notes', type:'textarea', span2:true }
    ],
    csv: ['id','name','email','country','timezone','start_iso','status','message','cal_booking_uid','created_at']
  },
  orders: {
    api: '/admin/api/orders',
    label: 'Orders & Payments',
    dateField: 'created_at',
    emailKey: 'payer_email',
    defaultSort: 'created_at',
    fromToLabels: ['Purchased from', 'Purchased to'],
    statusOptions: ['pending','completed','refunded','failed','cancelled'],
    columns: [
      { key:'payer_name', label:'Customer', sortable:true },
      { key:'payer_email', label:'Email', sortable:true },
      { key:'plan_name', label:'Plan' },
      { key:'amount', label:'Amount', type:'money', sortable:true },
      { key:'status', label:'Status', type:'badge', sortable:true },
      { key:'created_at', label:'Renewal Due', type:'renewal' },
      { key:'created_at', label:'Date', type:'datetime', sortable:true }
    ],
    formFields: [
      { key:'payer_name', label:'Customer Name', type:'text', required:true },
      { key:'payer_email', label:'Customer Email', type:'email', required:true },
      { key:'plan_key', label:'Plan Key', type:'select', options:['','ebi','kani','uni'] },
      { key:'plan_name', label:'Plan Name', type:'text' },
      { key:'amount', label:'Amount (JPY)', type:'text' },
      { key:'status', label:'Status', type:'select', options:['pending','completed','refunded','failed','cancelled'] },
      { key:'order_id', label:'Stripe Checkout Session ID', type:'text' },
      { key:'capture_id', label:'Stripe Payment Intent ID', type:'text' }
    ],
    csv: ['id','payer_name','payer_email','plan_key','plan_name','amount','currency','status','order_id','capture_id','created_at']

/* ============================================================
   HELPERS
   ============================================================ */
function esc(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// D1's datetime('now') produces "YYYY-MM-DD HH:MM:SS" (space-separated,
// implicit UTC); values we write ourselves are full ISO with T/Z. This
// normalizes either into a Date the browser parses as UTC.
function parseDbDate(iso){
  if (!iso) return null;
  const d = new Date(iso.includes('T') || iso.includes('Z') ? iso : iso.replace(' ', 'T') + 'Z');
  return isNaN(d) ? null : d;
}
function fmtDateTime(iso){
  const d = parseDbDate(iso);
  if (!d) return esc(iso || '');
  return d.toLocaleString(undefined, { year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}
function toDatetimeLocal(iso){
  const d = parseDbDate(iso);
  if (!d) return '';
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
async function api(path, opts){
  const res = await fetch(path, { credentials:'same-origin', headers:{ 'Content-Type':'application/json' }, ...opts });
  if (res.status === 401){ showLogin(); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.error || 'request-failed');
  return data;
}

function showLogin(){
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  renderLoginTurnstile();
}
function showDashboard(){

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  loadStats();

function renderLoginTurnstile(){
  if (!window.turnstile || loginTurnstileId !== null) return;
  loginTurnstileId = turnstile.render('#login-turnstile', { sitekey: TURNSTILE_SITE_KEY });
}

async function checkAuth(){
  try {
    const res = await fetch('/admin/api/me', { credentials:'same-origin' });
    if (res.ok) showDashboard(); else showLogin();
  } catch (e) { showLogin(); }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('loginPassword').value;
  const fb = document.getElementById('loginFeedback');
  const btn = document.getElementById('loginSubmit');
  const turnstileToken = (window.turnstile && loginTurnstileId !== null) ? turnstile.getResponse(loginTurnstileId) : '';

  fb.className = 'feedback'; fb.textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in…';

  try {
    const res = await fetch('/admin/api/login', {
      method:'POST', credentials:'same-origin', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ password, turnstileToken })
    });
    const data = await res.json();
    if (!res.ok || !data.success){
      const messages = {
        'invalid-password': 'Incorrect password.',
        'too-many-attempts': 'Too many failed attempts. Try again in 15 minutes.',
        'turnstile-failed': 'Security check failed — please retry.',
        'turnstile-required': 'Please complete the security check.'
      };
      fb.className = 'feedback err';
      fb.textContent = messages[data.error] || 'Sign-in failed. Please try again.';
      if (window.turnstile && loginTurnstileId !== null) turnstile.reset(loginTurnstileId);
      return;
    }
    document.getElementById('loginPassword').value = '';
    showDashboard();
  } catch (e) {
    fb.className = 'feedback err';
    fb.textContent = 'Network error — please try again.';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {

});

function renderRevenueChart(months){
  const el = document.getElementById('revenueChart');
  if (!months.length){
    el.innerHTML = '<p class="cell-muted kaku" style="padding:10px 0;">No completed orders in the last 6 months yet.</p>';
    return;
  }
  const max = Math.max(...months.map(m => m.total || 0), 1);
  el.innerHTML = `<div class="chart-bars">${months.map(m => {
    const total = m.total || 0;
    const heightPct = Math.max(4, Math.round((total / max) * 100));
    const label = new Date(m.month + '-02').toLocaleDateString(undefined, { month:'short' });
    return `<div class="chart-col">
      <span class="chart-val">¥${Math.round(total).toLocaleString()}</span>
      <div class="chart-bar" style="height:${heightPct}%;"></div>
      <span class="chart-label">${esc(label)}</span>
    </div>`;
  }).join('')}</div>`;
}

document.querySelectorAll('.tab-btn').forEach(btn => {

function switchTab(tab){
  currentTab = tab;
  currentPage = 1;
  selectedIds = new Set();
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

  const cfg = ENTITIES[tab];
  document.getElementById('filterQ').value = '';
  const statusSel = document.getElementById('filterStatus');
  statusSel.innerHTML = '<option value="">All statuses</option>' + cfg.statusOptions.map(s => `<option value="${s}">${humanize(s)}</option>`).join('');
  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value = '';
  document.getElementById('fromLabel').textContent = cfg.fromToLabels[0];
  document.getElementById('toLabel').textContent = cfg.fromToLabels[1];

  document.getElementById('bulkStatus').innerHTML = cfg.statusOptions.map(s => `<option value="${s}">${humanize(s)}</option>`).join('');
  updateBulkBar();

  renderTableHead(cfg);
  loadList();
}

function humanize(s){
  return String(s).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function renderTableHead(cfg){
  const state = sortState[currentTab];
  const ths = cfg.columns.map(c => {
    if (!c.sortable) return `<th>${esc(c.label)}</th>`;
    const active = state.sort === c.key;
    const arrow = active ? (state.dir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th class="sortable" data-sort="${esc(c.key)}">${esc(c.label)}${arrow}</th>`;
  }).join('');
  document.getElementById('tableHead').innerHTML =
    `<tr><th class="th-check"><input type="checkbox" id="selectAllCheckbox"></th>${ths}<th>Actions</th></tr>`;

  document.getElementById('selectAllCheckbox').addEventListener('change', (e) => {
    document.querySelectorAll('.row-check').forEach(cb => {
      cb.checked = e.target.checked;
      const id = Number(cb.dataset.id);
      if (e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
    });
    updateBulkBar();
  });

  document.querySelectorAll('#tableHead th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (state.sort === key) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
      else { state.sort = key; state.dir = 'asc'; }
      renderTableHead(cfg);
      currentPage = 1;
      loadList();
    });
  });
}

document.getElementById('filterQ').addEventListener('input', () => {

function buildQuery(extra){
  const params = new URLSearchParams();
  const q = document.getElementById('filterQ').value.trim();
  const status = document.getElementById('filterStatus').value;
  const from = document.getElementById('filterFrom').value;
  const to = document.getElementById('filterTo').value;
  if (q) params.set('q', q);
  if (status) params.set('status', status);
  if (from) params.set('from', from);
  if (to) params.set('to', to + 'T23:59:59');
  const state = sortState[currentTab];
  params.set('sort', state.sort);
  params.set('dir', state.dir);
  Object.entries(extra || {}).forEach(([k,v]) => params.set(k, v));
  return params.toString();
}

let lastTotal = 0;

async function loadList(){
  const cfg = ENTITIES[currentTab];
  const qs = buildQuery({ page: currentPage, pageSize: PAGE_SIZE });
  document.getElementById('tableBody').innerHTML = `<tr><td colspan="${cfg.columns.length+2}" class="cell-muted">Loading…</td></tr>`;
  document.getElementById('emptyState').classList.add('hidden');

  try {
    const data = await api(`${cfg.api}?${qs}`);
    lastTotal = data.total || 0;
    renderRows(cfg, data.items || []);
    renderPagination(data);
  } catch (e) {
    document.getElementById('tableBody').innerHTML = '';
    toast('Failed to load data: ' + e.message, 'err');
  }
}

function renderCell(col, row){
  const val = row[col.key];
  if (col.type === 'badge') {
    const cls = STATUS_BADGE[val] || 'badge-muted';
    return `<span class="badge ${cls}">${esc(humanize(val))}</span>`;
  }
  if (col.type === 'datetime') return esc(fmtDateTime(val));
  if (col.type === 'money') return val ? '¥' + esc(Number(val).toLocaleString()) : '';
  if (col.type === 'mono') return `<span class="cell-muted" style="font-family:monospace;">${esc(val)}</span>`;
  if (col.type === 'source') return val ? '<span class="badge badge-gold">Plan Interest</span>' : '<span class="badge badge-muted">Contact Form</span>';
  if (col.type === 'renewal') {
    if (row.status !== 'completed') return '<span class="cell-muted">—</span>';
    const created = parseDbDate(row.created_at);
    if (!created) return '<span class="cell-muted">—</span>';
    const renewal = new Date(created.getTime() + 30 * 86400000);
    const daysLeft = Math.ceil((renewal - Date.now()) / 86400000);
    const cls = daysLeft < 0 ? 'badge-danger' : daysLeft <= 7 ? 'badge-mango' : 'badge-muted';
    return `<span class="badge ${cls}">${esc(renewal.toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</span>`;
  }
  return esc(val);
}

let rowCache = {}; // id -> row data for the current page, used to prefill the edit form

function renderRows(cfg, items){
  rowCache = {};
  items.forEach(r => rowCache[r.id] = r);

  const tbody = document.getElementById('tableBody');
  if (!items.length){
    tbody.innerHTML = '';
    document.getElementById('emptyState').classList.remove('hidden');
    return;
  }
  document.getElementById('emptyState').classList.add('hidden');
  tbody.innerHTML = items.map(row => {
    const cells = cfg.columns.map(c => `<td data-label="${esc(c.label)}">${renderCell(c, row)}</td>`).join('');
    const email = cfg.emailKey ? row[cfg.emailKey] : '';
    const emailBtn = email ? `<button class="icon-btn" title="Customer profile" onclick="openCustomerModal('${esc(email).replace(/'/g, "\\'")}')">👤</button>` : '';

    let quickActions = '';
    if (currentTab === 'bookings' && row.status === 'booked') {
      quickActions = `
        <button class="icon-btn" title="Mark completed" onclick="quickStatus(${row.id},'completed')">✓</button>
        <button class="icon-btn danger" title="Mark no-show" onclick="quickStatus(${row.id},'no_show')">✕</button>`;
    }

    let linkBtn = '';
    if (currentTab === 'bookings' && row.cal_booking_uid) {
      linkBtn = `<a class="icon-btn" title="Open in Cal.com" target="_blank" rel="noopener" href="https://cal.com/booking/${encodeURIComponent(row.cal_booking_uid)}">🔗</a>`;
    } else if (currentTab === 'orders' && row.capture_id) {
      linkBtn = `<a class="icon-btn" title="Open in Stripe" target="_blank" rel="noopener" href="https://dashboard.stripe.com/payments/${encodeURIComponent(row.capture_id)}">🔗</a>`;
    }

    return `<tr>
      <td data-label=""><input type="checkbox" class="row-check" data-id="${row.id}" ${selectedIds.has(row.id) ? 'checked' : ''} onchange="toggleRowSelect(${row.id}, this.checked)"></td>
      ${cells}
      <td data-label="Actions"><div class="cell-actions">
        ${quickActions}
        ${linkBtn}
        ${emailBtn}
        <button class="icon-btn" title="Edit" onclick="openEditModal(${row.id})">✎</button>
        <button class="icon-btn danger" title="Delete" onclick="confirmDelete(${row.id})">🗑</button>
      </div></td>
    </tr>`;
  }).join('');
}

window.toggleRowSelect = (id, checked) => {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  updateBulkBar();
};

function updateBulkBar(){
  const bar = document.getElementById('bulkBar');
  const n = selectedIds.size;
  bar.classList.toggle('hidden', n === 0);
  document.getElementById('bulkCount').textContent = n + ' selected';
}

window.quickStatus = async (id, status) => {
  const cfg = ENTITIES[currentTab];
  try {
    await api(`${cfg.api}/${id}`, { method:'PATCH', body: JSON.stringify({ status }) });
    toast('Updated to ' + humanize(status) + '.', 'ok');
    loadList();
    loadStats();

    toast('Update failed: ' + err.message, 'err');
  }

function renderPagination(data){
  const totalPages = Math.max(1, Math.ceil((data.total || 0) / PAGE_SIZE));
  document.getElementById('pageInfo').textContent = `Page ${data.page} of ${totalPages} · ${data.total} total`;
  document.getElementById('prevPage').disabled = data.page <= 1;
  document.getElementById('nextPage').disabled = data.page >= totalPages;
}
document.getElementById('prevPage').addEventListener('click', () => { if (currentPage > 1){ currentPage--; loadList(); } });
document.getElementById('nextPage').addEventListener('click', () => { currentPage++; loadList(); });

document.getElementById('addBtn').addEventListener('click', () => openFormModal(null));
window.openEditModal = (id) => openFormModal(id);

function openFormModal(id){
  editingId = id;
  const cfg = ENTITIES[currentTab];
  const row = id ? (rowCache[id] || {}) : {};

  const fieldsHtml = cfg.formFields.map(f => {
    const val = row[f.key];
    const spanClass = f.span2 ? ' span2' : '';
    if (f.type === 'select') {
      const opts = f.options.map(o => `<option value="${esc(o)}" ${val === o ? 'selected' : ''}>${esc(o) || '—'}</option>`).join('');
      return `<div class="field ${spanClass}"><label>${esc(f.label)}</label><select data-field="${f.key}">${opts}</select></div>`;
    }
    if (f.type === 'textarea') {
      return `<div class="field ${spanClass}"><label>${esc(f.label)}</label><textarea data-field="${f.key}">${esc(val)}</textarea></div>`;
    }
    if (f.type === 'datetime-local') {
      return `<div class="field ${spanClass}"><label>${esc(f.label)}</label><input type="datetime-local" data-field="${f.key}" value="${toDatetimeLocal(val)}" ${f.required ? 'required' : ''}></div>`;
    }
    return `<div class="field ${spanClass}"><label>${esc(f.label)}</label><input type="${f.type}" data-field="${f.key}" value="${esc(val)}" ${f.required ? 'required' : ''}></div>`;
  }).join('');

  const modalHtml = `
    <div class="modal-overlay" id="formModalOverlay">
      <div class="modal">
        <h3>${id ? 'Edit' : 'Add'} — ${esc(cfg.label)}</h3>
        <p class="modal-sub">${id ? 'Update this record.' : 'Manually add a new record.'}</p>
        <form id="entityForm">
          <div class="modal-grid">${fieldsHtml}</div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" id="cancelFormBtn">Cancel</button>
            <button type="submit" class="btn btn-fill grow">${id ? 'Save Changes' : 'Add Record'}</button>
          </div>
        </form>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', modalHtml);

  document.getElementById('cancelFormBtn').addEventListener('click', closeFormModal);
  document.getElementById('formModalOverlay').addEventListener('click', (e) => { if (e.target.id === 'formModalOverlay') closeFormModal(); });
  document.getElementById('entityForm').addEventListener('submit', submitFormModal);
}

function closeFormModal(){
  const el = document.getElementById('formModalOverlay');
  if (el) el.remove();
  editingId = null;
}

async function submitFormModal(e){
  e.preventDefault();
  const cfg = ENTITIES[currentTab];
  const body = {};
  document.querySelectorAll('#entityForm [data-field]').forEach(input => {
    let val = input.value;
    if (input.dataset.field === 'start_iso' && val) {
      const d = new Date(val);
      if (!isNaN(d)) val = d.toISOString();
    }
    body[input.dataset.field] = val;
  });

  try {
    if (editingId) {
      await api(`${cfg.api}/${editingId}`, { method:'PATCH', body: JSON.stringify(body) });
      toast('Record updated.', 'ok');
    } else {
      await api(cfg.api, { method:'POST', body: JSON.stringify(body) });
      toast('Record added.', 'ok');
    }
    closeFormModal();
    loadList();
    loadStats();
  } catch (err) {
    toast('Save failed: ' + err.message, 'err');
  }
}

/* ============================================================
   CUSTOMER PROFILE — aggregates a customer's bookings, contacts and
   orders by email so their whole journey is visible in one place.
   ============================================================ */
window.openCustomerModal = async (email) => {
  const modalHtml = `
    <div class="modal-overlay" id="customerModalOverlay">
      <div class="modal" style="max-width:600px;">
        <h3>Customer Profile</h3>
        <p class="modal-sub">${esc(email)}</p>
        <div id="customerModalBody"><p class="cell-muted kaku">Loading…</p></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="closeCustomerModalBtn" style="flex:1;">Close</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  const close = () => { const el = document.getElementById('customerModalOverlay'); if (el) el.remove(); };
  document.getElementById('closeCustomerModalBtn').addEventListener('click', close);
  document.getElementById('customerModalOverlay').addEventListener('click', (e) => { if (e.target.id === 'customerModalOverlay') close(); });

  try {
    const data = await api(`/admin/api/customer?email=${encodeURIComponent(email)}`);
    const section = (title, jp, items, renderItem) => `
      <div style="margin-bottom:18px;">
        <div class="widget-title" style="font-size:.92rem;">${esc(title)} <span class="jp">${esc(jp)}</span></div>
        ${items.length ? items.map(renderItem).join('') : '<p class="cell-muted kaku" style="padding:6px 0;">None</p>'}
      </div>`;

    const html =
      section('Free Trial Bookings', '無料体験', data.bookings, b =>
        `<div class="upcoming-item"><span class="upcoming-when">${esc(fmtDateTime(b.start_iso))}</span><span class="upcoming-who">${esc(humanize(b.status))}</span></div>`) +
      section('Orders & Payments', '契約', data.orders, o =>
        `<div class="upcoming-item"><span class="upcoming-when">${esc(fmtDateTime(o.created_at))}</span><span class="upcoming-who">${esc(o.plan_name || o.plan_key || '')} — ¥${esc(Number(o.amount || 0).toLocaleString())}</span><span class="badge ${STATUS_BADGE[o.status] || 'badge-muted'}">${esc(humanize(o.status))}</span></div>`) +
      section('Messages', 'メッセージ', data.contacts, c =>
        `<div class="upcoming-item"><span class="upcoming-when">${esc(fmtDateTime(c.created_at))}</span><span class="upcoming-who">${esc(c.goal || c.message || '')}</span></div>`);

    document.getElementById('customerModalBody').innerHTML = html;
  } catch (err) {
    document.getElementById('customerModalBody').innerHTML = `<p class="feedback err">Failed to load: ${esc(err.message)}</p>`;
  }
};

/* ============================================================
   CSV EXPORT — pulls the current filtered set (up to 1000 rows)
   and downloads it client-side, no server endpoint needed.
   ============================================================ */
document.getElementById('exportBtn').addEventListener('click', async () => {
  const cfg = ENTITIES[currentTab];
  try {
    const qs = buildQuery({ page: 1, pageSize: 1000 });
    const data = await api(`${cfg.api}?${qs}`);
    const rows = data.items || [];
    if (!rows.length) { toast('Nothing to export.', 'err'); return; }

    const cols = cfg.csv;
    const csvLines = [cols.join(',')];
    rows.forEach(r => {
      csvLines.push(cols.map(c => {
        let v = r[c] === null || r[c] === undefined ? '' : String(r[c]);
        // Guard against CSV formula injection: Excel/Sheets treat a cell
        // starting with =, +, -, or @ as a formula when the file is opened.
        if (/^[=+\-@]/.test(v)) v = "'" + v;
        return '"' + v.replace(/"/g, '""') + '"';
      }).join(','));
    });
    const blob = new Blob([csvLines.join('\n')], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `suzu-${currentTab}-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    toast('Export failed.', 'err');
  }
});
