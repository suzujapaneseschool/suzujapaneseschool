<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Suzu Sensei</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
<style>
  :root{--cream:#fbf7ec;--mango:#f5b800;--mango-deep:#e89a00;--ink:#1f1a14;--ink-2:#5f5648;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;text-align:center;padding:24px;}
  .wrap{max-width:480px;}
  .code{font-size:5rem;font-weight:900;color:var(--mango-deep);line-height:1;margin:0 0 8px;}
  h1{font-size:1.5rem;margin:0 0 12px;}
  p{color:var(--ink-2);margin:0 0 28px;line-height:1.5;}
  a.btn{display:inline-block;background:var(--ink);color:var(--mango);text-decoration:none;font-weight:700;padding:14px 28px;border-radius:40px;}
  a.btn:hover{background:var(--mango-deep);color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>This page doesn't exist.</h1>
  <p>The page you're looking for may have moved, or the link might be broken. Let's get you back to Suzu Sensei's Japanese lessons.</p>
  <a class="btn" href="/">← Back to home</a>
</div>
</body>
</html>
